    const progress = document.getElementById("progress");

    const stage = document.getElementById("card-stage");
    let round = [], current = 0, score = 0, answered = false, results = [];

    function shuffle(values) {
      const copy = [...values];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function updateProgress() {
      progress.replaceChildren();
      for (let i = 0; i < 5; i++) {
        const dot = document.createElement("span");
        dot.className = "progress-dot h-2.5 flex-1 rounded-full " +
          (results[i] === true ? "bg-[#26824e]" : results[i] === false ? "bg-[#db7651]" : i === current ? "current bg-[#f49458]" : "bg-[#dce4d9]");

        progress.appendChild(dot);
      }
    }

      document.getElementById("score").textContent = `${score} / 100`;
      document.getElementById("next-button").classList.add("hidden");
      document.getElementById("finish-button").classList.add("hidden");
      const correct = round[current];
      images.forEach((img, index) => img.classList.toggle("hidden", index !== correct));
      document.getElementById("image-error").classList.toggle("hidden", !(images[correct].complete && images[correct].naturalWidth === 0));
      document.getElementById("image-error").classList.toggle("flex", images[correct].complete && images[correct].naturalWidth === 0);
      const choices = shuffle([correct, ...shuffle(countries.map((_, i) => i).filter(i => i !== correct)).slice(0, 3)]);
      options.replaceChildren();
      choices.forEach(index => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer-option min-h-16 rounded-xl bg-white px-3 py-3 text-center font-semibold text-[#153b34]";
        button.textContent = countries[index];
        button.addEventListener("click", () => answer(index));
        options.appendChild(button);
      });
      updateProgress();
    }

    function answer(choice) {
      if (answered) return;
      answered = true;
      const correct = round[current];
      const isCorrect = choice === correct;
      if (isCorrect) score += 20;
      results[current] = isCorrect;
      document.getElementById("score").textContent = `${score} / 100`;
      document.getElementById("revealed-country").textContent = countries[correct];
      document.getElementById("answer-result").textContent = isCorrect ? "答對了！＋20 分" : "再記住這個國家，下次一定行！";
      [...options.children].forEach(button => {
        button.disabled = true;
        if (button.textContent === countries[correct]) button.classList.add("correct");
        else if (button.textContent === countries[choice]) button.classList.add("incorrect");
      });
      stage.classList.add("flipped");
      document.getElementById(current === 4 ? "finish-button" : "next-button").classList.remove("hidden");
      updateProgress();
    }

    function start() {
      round = shuffle(countries.map((_, i) => i)).slice(0, 5);
      current = 0; score = 0; results = [];
      document.getElementById("end-view").classList.add("hidden");
      document.getElementById("play-view").classList.remove("hidden");
      showQuestion();
    }

    images.forEach(img => {
      img.addEventListener("error", () => {
        if (!img.classList.contains("hidden")) {
          document.getElementById("image-error").classList.remove("hidden");
          document.getElementById("image-error").classList.add("flex");
        }
      });
      img.addEventListener("load", () => {
        if (!img.classList.contains("hidden")) {
          document.getElementById("image-error").classList.add("hidden");
          document.getElementById("image-error").classList.remove("flex");
        }
      });
    });
    document.getElementById("next-button").addEventListener("click", () => { current++; showQuestion(); });
    document.getElementById("finish-button").addEventListener("click", () => {
      document.getElementById("play-view").classList.add("hidden");
      document.getElementById("end-view").classList.remove("hidden");
      document.getElementById("final-score").textContent = `${score} / 100 分`;
      document.getElementById("final-detail").textContent = `五題中答對 ${results.filter(Boolean).length} 題`;
    });
    document.getElementById("restart-button").addEventListener("click", start);
    start();
  </script>
 </body>
</html>
